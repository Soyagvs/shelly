name: Update release badges

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update badge payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-release-badges.sh
      - name: Commit changed badge payloads
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/badges/release.json .github/badges/downloads.json; then
            echo 'Badge payloads are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/release.json .github/badges/downloads.json
          git commit -m 'chore: update release badges'
          git push origin HEAD:main
