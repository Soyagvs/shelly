name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - label: macos-x86_64
            os: macos-15-intel
            target: macos-x86_64
            archive: tar.gz
          - label: macos-arm64
            os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - label: windows-x86_64
            os: windows-latest
            target: windows-x86_64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: |
          archive="shelly-${{ matrix.target }}-${GITHUB_REF_NAME}.${{ matrix.archive }}"
          tar -C target/release -czf "$archive" shelly shelly-lsp
          sha256sum "$archive" > "$archive.sha256"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "shelly-${{ matrix.target }}-$env:GITHUB_REF_NAME.${{ matrix.archive }}"
          Compress-Archive -Path target/release/shelly.exe,target/release/shelly-lsp.exe -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  $archive" | Set-Content "$archive.sha256"

      - name: Verify package contents
        if: runner.os != 'Windows'
        run: scripts/release-verify.sh "shelly-${{ matrix.target }}-${GITHUB_REF_NAME}.${{ matrix.archive }}" "$GITHUB_REF_NAME" "${{ matrix.target }}"

      - name: Upload binaries and checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shelly-${{ matrix.target }}-${{ github.ref_name }}.${{ matrix.archive }}
            shelly-${{ matrix.target }}-${{ github.ref_name }}.${{ matrix.archive }}.sha256

  update-badges:
    name: Update release badges
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update badge payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-release-badges.sh

      - name: Commit changed badge payloads
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/badges/release.json .github/badges/downloads.json; then
            echo 'Badge payloads are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/release.json .github/badges/downloads.json
          git commit -m 'chore: update release badges'
          git push origin HEAD:main
