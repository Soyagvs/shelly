[package]
name = "shelly"
default-run = "shelly"
version = "3.4.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
ureq = { version = "2", default-features = true }
flate2 = "1"
tar = "0.4"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
